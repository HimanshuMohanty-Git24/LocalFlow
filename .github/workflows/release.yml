name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: windows-nsis
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        run: choco install llvm -y --no-progress

      - name: Download bundled models
        shell: bash
        run: |
          mkdir -p models
          curl -L --fail --retry 3 -o models/ggml-base.en.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
          curl -L --fail --retry 3 -o models/ggml-silero-v5.1.2.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin"

      - name: Verify bundled model checksums
        shell: pwsh
        run: |
          $expected = Get-Content models/checksums.json | ConvertFrom-Json
          $files = @("ggml-base.en.bin", "ggml-silero-v5.1.2.bin")
          foreach ($file in $files) {
            $actual = (Get-FileHash "models/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            $wanted = $expected.PSObject.Properties[$file].Value
            if ($actual -ne $wanted) {
              throw "Checksum mismatch for $file"
            }
          }

      - name: Install frontend
        run: npm ci

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LocalFlow ${{ github.ref_name }}
          releaseBody: |
            Offline Windows dictation. Install the NSIS `.exe`, then hold Ctrl+B to speak.

            The installer includes Whisper `base.en` and Silero VAD. Setup and optional Qwen: https://github.com/HimanshuMohanty-Git24/LocalFlow/blob/main/docs/install.md

            Windows may warn that the app is unsigned (SmartScreen). That is expected until a code-signing certificate is added.

            A .sha256 file is published beside the installer so you can verify the download.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Publish installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$($installer.FullName).sha256"
          Set-Content -LiteralPath $checksum -Value "$hash  $($installer.Name)" -NoNewline
          gh release upload "${{ github.ref_name }}" $checksum --clobber
